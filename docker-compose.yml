# T-5-00 (D-66): local container stack. Host port 3020 (never 3000/3001, those belong to `npm run dev`).
# Run: docker compose build && docker compose up -d   ->   http://127.0.0.1:3020/tracking-plan/
name: e3-tracking

x-env: &env
  env_file:
    - path: .env.docker
      required: false
  environment:
    NODE_ENV: production
    E3_DB_PATH: /data/e3-tracking.sqlite
    E3_FILES_PATH: /data/files

services:
  app:
    build: .
    image: ${IMAGE:-e3-tracking:local}
    command: ["app"]
    ports:
      - "127.0.0.1:3020:3001"
    volumes:
      - e3_data:/data
    <<: *env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  backup:
    image: ${IMAGE:-e3-tracking:local}
    command: ["backup"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - e3_data:/data
    <<: *env
    restart: unless-stopped
    healthcheck:
      disable: true # no HTTP port; the image HEALTHCHECK targets the app

  # `docker compose run -T --rm mcp` -- stdio MCP server against the same DB file (D-33).
  mcp:
    image: ${IMAGE:-e3-tracking:local}
    command: ["mcp"]
    profiles: ["mcp"]
    stdin_open: true
    volumes:
      - e3_data:/data
    <<: *env
    healthcheck:
      disable: true

volumes:
  e3_data:
